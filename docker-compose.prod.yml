services:
  
  caddy:
    build:
      context: ./caddy
      dockerfile: Dockerfile-prod
    image: scoreboard_caddy_prod
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data_prod:/data
    depends_on:
      - django

  django:
    build:
      context: .
      dockerfile: Dockerfile-prod
    image: scoreboard_django_prod
    container_name: django
    restart: unless-stopped
    ports:
      - "8000:8000"
    command: bash -c "python3 manage.py makemigrations && python3 manage.py migrate && python3 manage.py collectstatic --no-input && daphne config.asgi:application -b 0.0.0.0 -p 8000"
    env_file:
      - ./.env.prod
    depends_on:
      - postgres
      - redis

  redis:
    image: redis:7.4.2
    container_name: redis
    restart: unless-stopped

  postgres:
    image: postgres:17.2
    container_name: postgres
    restart: unless-stopped
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data/
    env_file:
      - ./.env.prod


volumes:
  postgres_data_prod:
  caddy_data_prod: